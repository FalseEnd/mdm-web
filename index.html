<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<meta name="color-scheme" content="dark light" />
<title>MDM 密碼產生器</title>
<style>
  :root {
    --bg: #0f1420;
    --card: #1a2032;
    --card2: #222a40;
    --line: #2d3550;
    --text: #e8ecf6;
    --muted: #8b93a9;
    --accent: #5b8cff;
    --accent2: #3fd0a0;
    --danger: #ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0; padding: 0;
    background: var(--bg);
    color: var(--text);
    font-family: -apple-system, "Segoe UI", "Microsoft JhengHei", system-ui, sans-serif;
    -webkit-tap-highlight-color: transparent;
  }
  .wrap { max-width: 480px; margin: 0 auto; padding: 24px 16px 48px; }
  h1 { font-size: 22px; margin: 4px 0 2px; letter-spacing: .5px; }
  .sub { color: var(--muted); font-size: 13px; margin-bottom: 20px; }
  .card {
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 18px 16px;
    margin-bottom: 16px;
  }
  label { display: block; font-size: 13px; color: var(--muted); margin: 0 0 6px 2px; }
  input[type=text], select {
    width: 100%;
    background: var(--card2);
    border: 1px solid var(--line);
    color: var(--text);
    border-radius: 10px;
    padding: 12px 12px;
    font-size: 16px;
    outline: none;
    transition: border-color .15s;
  }
  input[type=text]:focus, select:focus { border-color: var(--accent); }
  .field { margin-bottom: 14px; }
  .modes { display: flex; gap: 8px; }
  .mode {
    flex: 1; text-align: center;
    background: var(--card2);
    border: 1px solid var(--line);
    border-radius: 10px;
    padding: 10px 4px;
    font-size: 14px;
    cursor: pointer;
    user-select: none;
    transition: all .15s;
  }
  .mode.active { border-color: var(--accent); background: rgba(91,140,255,.14); color: var(--accent); }
  button.gen {
    width: 100%;
    background: linear-gradient(135deg, var(--accent), #7aa0ff);
    color: #fff; border: 0;
    border-radius: 12px;
    padding: 15px;
    font-size: 17px;
    font-weight: 600;
    cursor: pointer;
    margin-top: 4px;
  }
  button.gen:active { transform: scale(.99); }
  .result {
    text-align: center;
    background: var(--card);
    border: 1px solid var(--line);
    border-radius: 16px;
    padding: 22px 16px;
  }
  .result .pw {
    font-size: 44px;
    font-weight: 700;
    letter-spacing: 8px;
    color: var(--accent2);
    font-variant-numeric: tabular-nums;
    margin: 4px 0;
    cursor: pointer;
  }
  .result .hint { color: var(--muted); font-size: 12px; }
  .result.empty .pw { color: var(--muted); letter-spacing: 4px; font-size: 28px; }
  .copied { color: var(--accent2); font-size: 12px; height: 16px; }
  .err { color: var(--danger); font-size: 13px; min-height: 18px; margin-top: 8px; }
  .foot { text-align: center; color: var(--muted); font-size: 11px; margin-top: 24px; line-height: 1.6; }
  datalist { color: #000; }
</style>
</head>
<body>
<div class="wrap">
  <h1>MDM 密碼產生器</h1>
  <div class="sub">輸入提示碼與營區名稱即可離線計算，不連線、不上傳。</div>

  <div class="card">
    <div class="field">
      <label for="hint">提示碼（螢幕上顯示的英數字串）</label>
      <input type="text" id="hint" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例如 Zivvrt" />
    </div>
    <div class="field">
      <label for="site">營區名稱</label>
      <input type="text" id="site" list="camps" autocomplete="off" placeholder="輸入或選擇營區，例如 中科院" />
      <datalist id="camps"></datalist>
    </div>
    <div class="field">
      <label>模式</label>
      <div class="modes" id="modes">
        <div class="mode active" data-mode="unlock">解鎖</div>
        <div class="mode" data-mode="uninstall">解除安裝</div>
        <div class="mode" data-mode="location">定位</div>
      </div>
    </div>
    <button class="gen" id="gen">產生密碼</button>
    <div class="err" id="err"></div>
  </div>

  <div class="result empty" id="resultCard">
    <div class="hint">點擊密碼可複製</div>
    <div class="pw" id="pw">— — — —</div>
    <div class="copied" id="copied"></div>
  </div>

  <div class="foot">
    純前端運算 · 資料不離開裝置<br />
    營區清單共 <span id="cnt">0</span> 筆，支援模糊輸入
  </div>
</div>

function generate(hint, site, kind) {
  let r = 0;
  for (let i = hint.length - 1; i >= 0; i--) {
    const idx = ALPHABET.indexOf(hint[i]);
    if (idx < 0) throw new Error("提示碼含有無效字元：" + hint[i]);
    r = (Math.imul(r, 62) + idx) | 0;
  }
  let p = 1;
  const s = site + SUFFIX[kind];
  for (let i = 0; i < s.length; i++) {
    p = Math.imul(p, s.charCodeAt(i)) | 0;
  }
  const ru = r >>> 0, pu = p >>> 0;
  const key = [0x46, 0x8b, 0x46, 0x8b];
  let v = 0;
  for (let i = 0; i < 4; i++) {
    const ab = (ru >>> ((3 - i) * 8)) & 0xff;
    const bb = (pu >>> ((3 - i) * 8)) & 0xff;
    v = (v << 8) | (ab ^ bb ^ key[i]);
  }
  v = v | 0;
  return String(Math.abs(v) % 1000000).padStart(4, "0");
}

  [...modesEl.children].forEach((c) => c.classList.toggle("active", c === t));

const pwEl = document.getElementById("pw");
const errEl = document.getElementById("err");
const resCard = document.getElementById("resultCard");
const copiedEl = document.getElementById("copied");

function run() {
  errEl.textContent = "";
  copiedEl.textContent = "";
  const hint = document.getElementById("hint").value.trim();
  const site = document.getElementById("site").value.trim();
  if (!hint) { errEl.textContent = "請輸入提示碼"; return; }
  if (!site) { errEl.textContent = "請輸入營區名稱"; return; }
  try {
    const pw = generate(hint, site, mode);
    pwEl.textContent = pw;
    resCard.classList.remove("empty");
  } catch (ex) {
    errEl.textContent = ex.message;
  }
}

document.getElementById("gen").addEventListener("click", run);
document.getElementById("hint").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
document.getElementById("site").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });

pwEl.addEventListener("click", () => {
  const txt = pwEl.textContent.trim();
  if (!/^\d+$/.test(txt)) return;
  navigator.clipboard?.writeText(txt).then(() => {
    copiedEl.textContent = "已複製 " + txt;
    setTimeout(() => (copiedEl.textContent = ""), 1500);
  });
});
