<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=5.0" />
<meta name="color-scheme" content="dark light" />
<title>MDM 密碼產生器</title>
<style>
  :root {
    --bg:#0f1420; --card:#1a2032; --card2:#222a40; --line:#2d3550;
    --text:#e8ecf6; --muted:#8b93a9; --accent:#5b8cff; --accent2:#3fd0a0; --danger:#ff6b6b;
  }
  * { box-sizing: border-box; }
  html, body { margin:0; padding:0; background:var(--bg); color:var(--text);
    font-family:-apple-system,"Segoe UI","Microsoft JhengHei",system-ui,sans-serif;
    -webkit-tap-highlight-color:transparent; }
  .wrap { max-width:480px; margin:0 auto; padding:20px 16px 48px; }
  h1 { font-size:22px; margin:4px 0 2px; letter-spacing:.5px; }
  .sub { color:var(--muted); font-size:13px; margin-bottom:16px; }
  .tabs { display:flex; gap:8px; margin-bottom:16px; }
  .tab { flex:1; text-align:center; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; padding:11px 4px; font-size:15px; cursor:pointer; user-select:none; transition:all .15s; }
  .tab.active { border-color:var(--accent); background:rgba(91,140,255,.14); color:var(--accent); font-weight:600; }
  .page { display:none; } .page.active { display:block; }
  .card { background:var(--card); border:1px solid var(--line); border-radius:16px; padding:18px 16px; margin-bottom:16px; }
  label { display:block; font-size:13px; color:var(--muted); margin:0 0 6px 2px; }
  input[type=text], input[type=search], input[type=tel] { width:100%; background:var(--card2);
    border:1px solid var(--line); color:var(--text); border-radius:10px; padding:12px; font-size:16px; outline:none; transition:border-color .15s; }
  input:focus { border-color:var(--accent); }
  .field { margin-bottom:14px; }
  .modes { display:flex; gap:8px; }
  .mode { flex:1; text-align:center; background:var(--card2); border:1px solid var(--line);
    border-radius:10px; padding:10px 4px; font-size:14px; cursor:pointer; user-select:none; transition:all .15s; }
  .mode.active { border-color:var(--accent); background:rgba(91,140,255,.14); color:var(--accent); }
  button.gen { width:100%; background:linear-gradient(135deg,var(--accent),#7aa0ff); color:#fff; border:0;
    border-radius:12px; padding:15px; font-size:17px; font-weight:600; cursor:pointer; margin-top:4px; }
  button.gen:disabled { opacity:.5; cursor:default; }
  button.gen:active { transform:scale(.99); }
  .result { text-align:center; background:var(--card); border:1px solid var(--line); border-radius:16px; padding:22px 16px; }
  .result .pw { font-size:44px; font-weight:700; letter-spacing:8px; color:var(--accent2);
    font-variant-numeric:tabular-nums; margin:4px 0; cursor:pointer; }
  .result .hint { color:var(--muted); font-size:12px; }
  .result.empty .pw { color:var(--muted); letter-spacing:4px; font-size:28px; }
  .copied { color:var(--accent2); font-size:12px; height:16px; }
  .err { color:var(--danger); font-size:13px; min-height:18px; margin-top:8px; }
  .ok { color:var(--accent2); font-size:13px; min-height:18px; margin-top:8px; }
  .foot { text-align:center; color:var(--muted); font-size:11px; margin-top:24px; line-height:1.6; }
  datalist { color:#000; }
  .who { color:var(--muted); font-size:12px; margin-bottom:12px; }
  .linkbtn { background:none; border:0; color:var(--accent); font-size:12px; cursor:pointer; padding:0; }

  .qrhint { color:var(--muted); font-size:12px; margin:2px 2px 10px; }
  #qrList { display:flex; flex-direction:column; gap:10px; }
  .qrItem { display:flex; align-items:center; gap:12px; background:var(--card); border:1px solid var(--line);
    border-radius:12px; padding:10px; cursor:pointer; transition:border-color .15s; }
  .qrItem:active { border-color:var(--accent); }
  .qrItem img { width:64px; height:64px; object-fit:cover; border-radius:8px; background:#fff; flex:none; }
  .qrItem .lbl { font-size:14px; line-height:1.4; }
  .qrEmpty { color:var(--muted); font-size:13px; text-align:center; padding:20px 0; }
  .qrCount { color:var(--muted); font-size:12px; margin:8px 2px; }

  /* gate */
  #gate { position:fixed; inset:0; z-index:40; background:var(--bg); display:flex; align-items:center; justify-content:center; padding:20px; }
  #gate .box { width:100%; max-width:380px; }
  #gate h2 { font-size:20px; margin:0 0 6px; }
  #gate .desc { color:var(--muted); font-size:13px; margin-bottom:18px; line-height:1.6; }
  .step { display:none; } .step.active { display:block; }
  #app { display:none; } #app.ready { display:block; }

  #lb { position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.92); display:none; flex-direction:column; }
  #lb.open { display:flex; }
  #lbBar { display:flex; align-items:center; justify-content:space-between; padding:12px 14px; gap:10px; }
  #lbTitle { font-size:14px; color:#fff; flex:1; line-height:1.4; }
  #lbClose { background:rgba(255,255,255,.14); color:#fff; border:0; border-radius:10px; padding:8px 14px; font-size:15px; cursor:pointer; flex:none; }
  #lbScroll { flex:1; overflow:auto; -webkit-overflow-scrolling:touch; text-align:center; }
  #lbImg { max-width:none; width:100%; display:block; }
  #lbUse { margin:12px auto; display:block; background:var(--accent); color:#fff; border:0; border-radius:10px; padding:11px 18px; font-size:15px; cursor:pointer; }
</style>
</head>
<body>

<!-- 使用前驗證 -->
<div id="gate">
  <div class="box">
    <h2>使用前驗證</h2>
    <div class="desc">本工具限授權裝置使用。請輸入身分並送出，系統會通知管理者；管理者點信中「確定授權」後，這台裝置即可使用（之後只有這台裝置能用）。</div>

    <div class="step active" id="step1">
      <div class="field">
        <label for="who">你是誰</label>
        <input type="text" id="who" autocomplete="off" placeholder="輸入你的名字或單位" />
      </div>
      <button class="gen" id="sendCode">送出授權申請</button>
      <div class="err" id="gateErr1"></div>
    </div>

    <div class="step" id="step2">
      <div class="desc">已送出授權申請到管理者信箱。請管理者打開信件、點「確定授權」按鈕。授權後此畫面會自動解鎖。</div>
      <div class="ok" id="waitState">等待授權中…</div>
      <div style="margin-top:12px"><button class="linkbtn" id="backStep1">重新輸入身分 / 重新申請</button></div>
    </div>
  </div>
</div>

<!-- 主程式 -->
<div id="app">
<div class="wrap">
  <h1>MDM 密碼產生器</h1>
  <div class="sub">已綁定授權裝置。密碼由伺服器計算。</div>
  <div class="who" id="whoLine"></div>

  <div class="tabs">
    <div class="tab active" data-tab="gen">密碼產生</div>
    <div class="tab" data-tab="qr">QR 搜尋</div>
  </div>

  <div class="page active" id="page-gen">
    <div class="card">
      <div class="field">
        <label for="hint">提示碼（螢幕上顯示的英數字串）</label>
        <input type="text" id="hint" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="例如 Zivvrt" />
      </div>
      <div class="field">
        <label for="site">營區名稱</label>
        <input type="text" id="site" list="camps" autocomplete="off" placeholder="輸入或選擇營區，例如 中科院" />
        <datalist id="camps"></datalist>
      </div>
      <div class="field">
        <label>模式</label>
        <div class="modes" id="modes">
          <div class="mode active" data-mode="unlock">解鎖</div>
          <div class="mode" data-mode="uninstall">解除安裝</div>
          <div class="mode" data-mode="location">定位</div>
        </div>
      </div>
      <button class="gen" id="gen">產生密碼</button>
      <div class="err" id="err"></div>
    </div>

    <div class="result empty" id="resultCard">
      <div class="hint">點擊密碼可複製</div>
      <div class="pw" id="pw">— — — —</div>
      <div class="copied" id="copied"></div>
    </div>
  </div>

  <div class="page" id="page-qr">
    <div class="field">
      <input type="search" id="qrSearch" autocomplete="off" placeholder="輸入營區關鍵字，例如 中科院、龍泉" />
    </div>
    <div class="qrhint">可輸入多個關鍵字（空白分隔）同時篩選；部分圖片含多個營區。點縮圖看大圖。</div>
    <div class="qrCount" id="qrCount"></div>
    <div id="qrList"></div>
  </div>

  <div class="foot">
    演算法於伺服器端運算 · 僅授權裝置可用<br />
    營區 QR 共 <span id="cnt">0</span> 筆 · <button class="linkbtn" id="unbind">解除本裝置綁定</button>
  </div>
</div>
</div>

<div id="lb">
  <div id="lbBar"><div id="lbTitle"></div><button id="lbClose">關閉</button></div>
  <div id="lbScroll"><img id="lbImg" alt="" /><button id="lbUse">用此營區名稱產生密碼</button></div>
</div>

// ---- device identity + binding ----
function deviceId() {
  let id = localStorage.getItem("mdm_dev");
  if (!id) { id = (crypto.randomUUID ? crypto.randomUUID() : String(Date.now()) + Math.random()); localStorage.setItem("mdm_dev", id); }
  return id;
}
function getToken() { return localStorage.getItem("mdm_tok") || ""; }
function setToken(t) { localStorage.setItem("mdm_tok", t); }
function getWho() { return localStorage.getItem("mdm_who") || ""; }

async function api(action, extra) {
  const res = await fetch(API, {
    method: "POST",
    headers: { "content-type": "application/json" },
    body: JSON.stringify(Object.assign({ action, deviceId: deviceId() }, extra || {})),
  });
  let data = {};
  try { data = await res.json(); } catch {}
  if (!res.ok) throw new Error(data.error || ("HTTP " + res.status));
  return data;
}

// ---- gate ----
const gate = document.getElementById("gate");
const appEl = document.getElementById("app");
const step1 = document.getElementById("step1");
const step2 = document.getElementById("step2");

function showApp() {
  gate.style.display = "none";
  appEl.classList.add("ready");
  document.getElementById("whoLine").textContent = getWho() ? ("使用者：" + getWho()) : "";
}
function showStep(n) {
  step1.classList.toggle("active", n === 1);
  step2.classList.toggle("active", n === 2);
}

let pollTimer = null;
function stopPoll() { if (pollTimer) { clearInterval(pollTimer); pollTimer = null; } }
async function pollOnce() {
  try {
    const r = await api("status", {});
    if (r.status === "approved" && r.token) {
      stopPoll();
      setToken(r.token);
      showApp();
    } else if (r.status === "blocked") {
      stopPoll();
      document.getElementById("waitState").textContent = "此裝置已被封鎖";
    }
  } catch { /* keep polling */ }
}
function startPoll() {
  stopPoll();
  document.getElementById("waitState").textContent = "等待授權中…";
  pollTimer = setInterval(pollOnce, 3000);
}

document.getElementById("sendCode").addEventListener("click", async () => {
  const e = document.getElementById("gateErr1"); e.textContent = "";
  const name = document.getElementById("who").value.trim();
  if (!name) { e.textContent = "請輸入你是誰"; return; }
  const btn = document.getElementById("sendCode"); btn.disabled = true; btn.textContent = "送出中…";
  try {
    localStorage.setItem("mdm_who", name);
    const r = await api("start", { name });
    if (r.approved) {
      const s = await api("status", {});
      if (s.token) { setToken(s.token); showApp(); return; }
    }
    showStep(2);
    startPoll();
  } catch (ex) { e.textContent = ex.message; }
  finally { btn.disabled = false; btn.textContent = "送出授權申請"; }
});

document.getElementById("backStep1").addEventListener("click", () => { stopPoll(); showStep(1); });

document.getElementById("unbind").addEventListener("click", () => {
  localStorage.removeItem("mdm_tok");
  location.reload();
});

  mode = t.dataset.mode;
  [...modesEl.children].forEach((c) => c.classList.toggle("active", c === t));

const pwEl = document.getElementById("pw");
const errEl = document.getElementById("err");
const resCard = document.getElementById("resultCard");
const copiedEl = document.getElementById("copied");
const siteInput = document.getElementById("site");
const genBtn = document.getElementById("gen");

async function run() {
  errEl.textContent = ""; copiedEl.textContent = "";
  const hint = document.getElementById("hint").value.trim();
  const site = siteInput.value.trim();
  if (!hint) { errEl.textContent = "請輸入提示碼"; return; }
  if (!site) { errEl.textContent = "請輸入營區名稱"; return; }
  genBtn.disabled = true; genBtn.textContent = "計算中…";
  try {
    const r = await api("generate", { token: getToken(), hint, site, mode });
    pwEl.textContent = r.pw;
    resCard.classList.remove("empty");
  } catch (ex) {
    errEl.textContent = ex.message;
    if (/未授權|未授權|403|401/.test(ex.message)) { /* token invalid */ }
  } finally { genBtn.disabled = false; genBtn.textContent = "產生密碼"; }
}
genBtn.addEventListener("click", run);
document.getElementById("hint").addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });
siteInput.addEventListener("keydown", (e) => { if (e.key === "Enter") run(); });

pwEl.addEventListener("click", () => {
  const txt = pwEl.textContent.trim();
  if (!/^\d+$/.test(txt)) return;
  navigator.clipboard?.writeText(txt).then(() => {
    copiedEl.textContent = "已複製 " + txt; setTimeout(() => (copiedEl.textContent = ""), 1500);
  });
});

});

const norm = (s) => s.toLowerCase().replace(/[\s_\-－—/]+/g, "");
const qrSearch = document.getElementById("qrSearch");
const qrList = document.getElementById("qrList");
const qrCount = document.getElementById("qrCount");
function renderQr(q) {
  const terms = q.trim().split(/\s+/).map(norm).filter(Boolean);
  let items;
  if (!terms.length) items = QR.slice();
  else {
    items = QR.filter((x) => { const l = norm(x.l); return terms.every((t) => l.includes(t)); });
    const wq = norm(q); const score = (l) => (l === wq ? 0 : l.startsWith(wq) ? 1 : l.includes(wq) ? 2 : 3);
    items.sort((a, b) => score(norm(a.l)) - score(norm(b.l)) || a.l.length - b.l.length || a.i - b.i);
  }
  qrCount.textContent = terms.length ? `找到 ${items.length} 筆` : `共 ${items.length} 筆`;
  qrList.innerHTML = items.length
    ? items.map((x) => `<div class="qrItem" data-id="${x.i}" data-label="${x.l.replace(/"/g,"&quot;")}"><img loading="lazy" src="qr/${x.i}.jpg" alt=""/><div class="lbl">${x.l}</div></div>`).join("")
    : '<div class="qrEmpty">找不到符合的營區</div>';
}
qrSearch.addEventListener("input", () => renderQr(qrSearch.value));
renderQr("");

// ---- lightbox ----
const lb = document.getElementById("lb");
const lbImg = document.getElementById("lbImg");
const lbTitle = document.getElementById("lbTitle");
let lbLabel = "";
qrList.addEventListener("click", (e) => {
  const it = e.target.closest(".qrItem"); if (!it) return;
  lbLabel = it.dataset.label; lbTitle.textContent = lbLabel;
  lbImg.src = "qr/" + it.dataset.id + ".jpg"; lb.classList.add("open");
});
document.getElementById("lbClose").addEventListener("click", () => lb.classList.remove("open"));
document.getElementById("lbUse").addEventListener("click", () => {
  lb.classList.remove("open"); siteInput.value = lbLabel;
  tabsEl.children[0].click(); siteInput.scrollIntoView({ behavior: "smooth", block: "center" });
});

// ---- boot ----
if (getToken()) showApp(); else { gate.style.display = "flex"; showStep(1); }
</script>
